<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#1f5c4d"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>كاشير الكافيه</title>
<style>
:root{--bg:#eef2ef;--sf:#fff;--tx:#14211d;--mu:#5f706a;--ac:#1f5c4d;--on:#fff;--a2:#e1ece6;--bd:#cfdcd5;--rd:#b3261e;--gn:#1b7a4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101a17;--sf:#172420;--tx:#e8f0ec;--mu:#9bb0a7;--ac:#6fcf9f;--on:#0c1613;--a2:#1f342d;--bd:#2c4a40;--rd:#ff8a80;--gn:#7fe0a8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101a17;--sf:#172420;--tx:#e8f0ec;--mu:#9bb0a7;--ac:#6fcf9f;--on:#0c1613;--a2:#1f342d;--bd:#2c4a40;--rd:#ff8a80;--gn:#7fe0a8;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--ac);color:var(--on)}
.bar button{background:transparent;color:var(--on);border:1px solid var(--on)}
.tabs{display:flex;gap:6px;padding:10px 12px;overflow-x:auto}
.tabs button{flex:none;padding:8px 14px;border-radius:20px;border:1px solid var(--bd);background:var(--sf);color:var(--tx)}
.tabs button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.pg{padding:0 12px 40px;max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--gm,130px),1fr));gap:8px;margin-bottom:12px}
.pb{display:flex;flex-direction:column;gap:4px;padding:16px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--tx);font-size:var(--pf,16px)}
.pb b{color:var(--ac)}
.pb{padding:var(--pp,8px)}.im{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--a2);display:flex;align-items:center;justify-content:center;font-size:32px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:17px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}
.tot{font-size:18px;border:0}
button{font:inherit;cursor:pointer}
.b{background:var(--ac);color:var(--on);border:0;border-radius:8px;padding:9px 14px}
.b:disabled{opacity:.4}.big{width:100%;margin-top:8px;padding:13px}
.s{background:var(--a2);color:var(--tx);border:0;border-radius:6px;padding:4px 10px;margin-top:4px}
input,select,textarea{font:inherit;width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
.w{width:84px}label{display:block;margin:8px 0;color:var(--mu);font-size:14px}
label input,label select{margin-top:3px;color:var(--tx)}
.mu{color:var(--mu)}.ok{color:var(--gn)}.rd{color:var(--rd)}.gn{color:var(--gn)}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kp div{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px}
.kp small{display:block;color:var(--mu)}.kp b{font-size:20px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:4px;text-align:start;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.ch{display:flex;align-items:center;gap:4px;margin:0;padding:4px 8px;border:1px solid var(--bd);border-radius:14px;color:var(--tx)}.ch input{width:auto;margin:0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.md{background:var(--sf);border-radius:12px;padding:16px;width:100%;max-width:380px;max-height:90vh;overflow:auto}
</style></head><body><div id="app"></div>
<script>
const K='cafe_pos_v1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,8);
const f=n=>(Math.round(n*100)/100).toLocaleString('en'),e=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function seed(){const m=(id,name,unit,stock,cost)=>({id,name,unit,stock,cost});
return fix({pin:'1234',mats:[m('flour','طحين','غ',10000,0.002),m('milk','حليب','مل',10000,0.0015),m('egg','بيض','حبة',60,0.25),m('choc','شوكولا','غ',2000,0.01),m('bean','بن','غ',3000,0.02),m('cup','كوب','حبة',200,0.05),m('glove','قفاز','حبة',100,0.03)],
mixes:[{id:'crep',name:'خلطة الكريب',yield:2800,stock:2800,items:[{m:'flour',q:1000},{m:'milk',q:1500},{m:'egg',q:10}]}],
products:[{id:'p1',name:'كريب شوكولا',price:15,mix:{id:'crep',g:80},items:[{m:'choc',q:20}],ask:['glove']},{id:'p2',name:'قهوة',price:10,mix:null,items:[{m:'bean',q:18},{m:'cup',q:1}],ask:[]}],sales:[],waste:[]})}
function fix(o){o.cust=o.cust||[];if(o.ppu==null)o.ppu=1;o.tables=o.tables||[];o.sw=o.sw||60;o.fee=o.fee||0;o.tcost=o.tcost||0;if(!o.fl){o.mats.push({id:'bk1',name:'بسكويت 1',unit:'حبة',stock:100,cost:0.1},{id:'bk2',name:'بسكويت 2',unit:'حبة',stock:100,cost:0.2},{id:'cp',name:'طاسة بلاستيك',unit:'حبة',stock:100,cost:0.05},{id:'tub',name:'علبة بوظة',unit:'حبة',stock:50,cost:0.3});o.fl=[{id:'fc',name:'شوكولا',stock:5000,cost:30,sp:5,kp:60},{id:'fm',name:'حليب',stock:5000,cost:25,sp:4,kp:50},{id:'ff',name:'فريز',stock:5000,cost:28,sp:5,kp:55}];o.cn=[{id:'c1',name:'بوري بسكوت 1',t:'c',extra:0,m:'bk1'},{id:'c2',name:'بوري بسكوت 2',t:'c',extra:2,m:'bk2'},{id:'c3',name:'طاسة',t:'c',extra:0,m:'cp'},{id:'k1',name:'علبة كيلو',t:'k',extra:0,m:'tub'}];o.gift={cn:'c1',per:1000}}o.cats=o.cats||[];o.days=o.days||[];o.theme=o.theme||{};if(o.maxd==null)o.maxd=10;o.gas=o.gas||{cost:0,since:Date.now(),hist:[]};return o}
function load(){let o;try{const r=localStorage.getItem(K);if(r)o=JSON.parse(r)}catch(x){}return fix(o||seed())}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}}
let S=load(),mode='c',tab='sale',cart={},modal=null,note='',rp='d',pend=[];
const M=id=>S.mats.find(x=>x.id==id),X=id=>S.mixes.find(x=>x.id==id),P=id=>S.products.find(x=>x.id==id);
const cpg=x=>x.items.reduce((a,i)=>a+i.q*(M(i.m)?M(i.m).cost:0),0)/(x.yield||1);
const pcost=p=>(p.mix&&X(p.mix.id)?p.mix.g*cpg(X(p.mix.id)):0)+p.items.reduce((a,i)=>a+i.q*(M(i.m)?M(i.m).cost:0),0);
const at=p=>p.split('.').reduce((o,k)=>o[k],S);
function U(p,v,r){const k=p.split('.'),l=k.pop();k.reduce((o,x)=>o[x],S)[l]=v;save();if(r)render()}
function A(p,o){at(p).push(o);save();render()}
function D(p,i){at(p).splice(i,1);save();render()}
function addIt(p){A(p,{m:S.mats[0]?S.mats[0].id:'',q:1})}
function setMix(i,v){const p=S.products[i];p.mix=v?{id:v,g:p.mix?p.mix.g:50}:null;save();render()}
function tgl(i,m){const p=S.products[i],a=p.ask||(p.ask=[]),j=a.indexOf(m);j<0?a.push(m):a.splice(j,1);save()}
const IE=(p,l)=>l.map((it,j)=>`<div class="row"><select onchange="U('${p}.${j}.m',this.value,1)">${S.mats.map(m=>`<option value="${m.id}" ${m.id==it.m?'selected':''}>${e(m.name)}</option>`).join('')}</select><input class="w" type="number" step="any" value="${it.q}" onchange="U('${p}.${j}.q',+this.value,1)"><small>${e(M(it.m)?M(it.m).unit:'')}</small>${p.startsWith('products')?`<select class="w" onchange="U('${p}.${j}.t',this.value)"><option value="">دائمًا</option><option value="to" ${it.t=='to'?'selected':''}>سفري فقط</option><option value="in" ${it.t=='in'?'selected':''}>داخل فقط</option></select>`:''}<button class="s" onclick="D('${p}',${j})">✕</button></div>`).join('')+`<button class="s" onclick="addIt('${p}')">+ مكوّن</button>`;
const msg=()=>note?`<p class="ok">${e(note)}</p>`:'';
const T=(k,l)=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';note='';render()">${l}</button>`;
function render(){applyTheme();
let h=`<div class="bar"><b>☕ كاشير الكافيه</b>${mode=='m'?`<button class="s" onclick="mode='c';tab='sale';render()">خروج من المدير</button>`:`<button class="s" onclick="ask()">🔒 المدير</button>`}</div><div class="tabs">`;
h+=(mode=='m'?[['rep','التقارير'],['wh','المستودع'],['mx','الخلطات'],['pr','المنتجات'],['ied','المثلجات'],['gas','الغاز'],['st','الإعدادات']]:[['sale','البيع'],['prep','تحضير خلطة'],['waste','إتلاف']]).map(t=>T(t[0],t[1])).join('');
$('#app').innerHTML=h+'</div><div class="pg">'+V[tab]()+'</div>'+(modal||'')}
const V={
sale(){let tot=0;const ids=Object.keys(cart).filter(id=>P(id));
const rows=ids.map(id=>{const p=P(id),q=cart[id];tot+=p.price*q;return `<div class="row"><span>${e(p.name)}</span><span><button class="s" onclick="add('${id}',-1)">−</button> ${q} <button class="s" onclick="add('${id}',1)">+</button></span><b>${f(p.price*q)}</b></div>`}).join('');
return `${tbBar()}${catTabs()}<div class="grid">${S.products.filter(p=>!cat||p.cat==cat).map(p=>`<button class="pb" onclick="${rd?`redeem('${p.id}')`:`add('${p.id}',1)`}">${p.img?`<img class="im" src="${p.img}">`:'<div class="im">☕</div>'}<span>${e(p.name)}</span>${pw?'':`<b>${rd?(p.pc?p.pc+' نقطة':'—'):f(p.price)}</b>`}</button>`).join('')}</div><div class="card"><h3>${pw?'مسحوب شخصي (دون فاتورة ودون ربح)':'سلة المبيعات'}</h3><div class="tabs" style="padding-inline:0"><button class="${typ=='in'?'on':''}" onclick="typ='in';render()">داخل الكافيه</button><button class="${typ=='to'?'on':''}" onclick="typ='to';render()">سفري</button></div>${rows}${xr()}${!rows&&!xl.length?'<p class="mu">السلة فارغة. اضغط على منتج لإضافته.</p>':''}${tb?`<div class="row"><span>رسوم الطاولة</span><b>${f(S.fee)}</b></div>`:''}<div class="row tot"><span>المجموع</span><b>${f(tot+xl.reduce((a,l)=>a+l.price,0)+(tb?S.fee:0))}</b></div><button class="b big" ${ids.length||xl.length?'':'disabled'} onclick="checkout()">${pw?'تسجيل مسحوب شخصي':'إصدار الفاتورة'}</button></div>${msg()}`},
prep(){return `<div class="card"><h3>تحضير خلطة</h3>${S.mixes.map(x=>`<div class="row"><span>${e(x.name)}</span><span><input class="w" type="number" min="1" value="1" id="n_${x.id}"> <button class="b" onclick="doPrep('${x.id}')">تحضير</button></span></div>`).join('')||'<p class="mu">لا توجد خلطات.</p>'}<p class="mu">اكتب عدد الخلطات التي حضّرتها.</p></div>${msg()}`},
waste(){return `<div class="card"><h3>إتلاف خلطة</h3><label>الخلطة<select id="wm">${S.mixes.map(x=>`<option value="${x.id}">${e(x.name)}</option>`).join('')}</select></label><label>الوزن التالف (غرام)<input type="number" id="wg" inputmode="decimal"></label><label>السبب (اختياري)<input id="wr"></label><button class="b big" onclick="doWaste()">تسجيل الإتلاف</button></div>${msg()}`},
rep(){const D=864e5,n=Date.now(),per={d:['اليوم',new Date().setHours(0,0,0,0)],w:['آخر 7 أيام',n-7*D],m:['آخر 30 يومًا',n-30*D],a:['الكل',0]},from=per[rp][1];
const sl=S.sales.filter(s=>s.t>=from),wl=S.waste.filter(w=>w.t>=from),sum=(a,k)=>a.reduce((t,x)=>t+x[k],0),R=sum(sl,'total'),C=sum(sl,'cost'),W=sum(wl,'cost'),tp={};
sl.forEach(s=>s.lines.forEach(l=>{const o=tp[l.p]||(tp[l.p]={q:0,r:0,c:0});o.q+=l.q;o.r+=l.rev;o.c+=l.cost}));
const dt=t=>new Date(t).toLocaleString('ar',{dateStyle:'short',timeStyle:'short'});
return `<div class="tabs" style="padding-inline:0">${Object.keys(per).map(k=>`<button class="${rp==k?'on':''}" onclick="rp='${k}';render()">${per[k][0]}</button>`).join('')}</div>
<div class="kp"><div><small>المبيعات</small><b>${f(R)}</b></div><div><small>تكلفة ما بِيع</small><b>${f(C)}</b></div><div><small>قيمة الإتلاف</small><b>${f(W)}</b></div><div><small>صافي الربح</small><b class="${R-C-W>=0?'gn':'rd'}">${f(R-C-W)}</b></div></div>
<div class="card"><h3>المنتجات الأكثر مبيعًا</h3>${Object.entries(tp).sort((a,b)=>b[1].q-a[1].q).map(([k,o])=>`<div class="row"><span>${e(k)} × ${o.q}</span><span>ربح ${f(o.r-o.c)}</span></div>`).join('')||'<p class="mu">لا توجد مبيعات في هذه الفترة.</p>'}</div>
<div class="card"><h3>سجل الإتلاف</h3>${wl.slice(-10).reverse().map(w=>`<div class="row"><span>${e(w.mix)} · ${f(w.g)} غ<br><small class="mu">${dt(w.t)} ${e(w.r)}</small></span><b class="rd">${f(w.cost)}</b></div>`).join('')||'<p class="mu">لا يوجد إتلاف.</p>'}</div>`},
wh(){return `<div class="card"><h3>المواد الخام</h3><div class="tw"><table><tr><th>المادة</th><th>الوحدة</th><th>المخزون</th><th>تكلفة الوحدة</th><th></th></tr>${S.mats.map((m,i)=>`<tr><td><input value="${e(m.name)}" onchange="U('mats.${i}.name',this.value)"></td><td><input class="w" value="${e(m.unit)}" onchange="U('mats.${i}.unit',this.value)"></td><td><input class="w" type="number" step="any" value="${+m.stock.toFixed(2)}" onchange="U('mats.${i}.stock',+this.value)"></td><td><input class="w" type="number" step="any" value="${m.cost}" onchange="U('mats.${i}.cost',+this.value)"></td><td><button class="s" onclick="D('mats',${i})">🗑</button></td></tr>`).join('')}</table></div><button class="b" onclick="A('mats',{id:uid(),name:'مادة جديدة',unit:'غ',stock:0,cost:0})">+ مادة</button></div>`},
mx(){return S.mixes.map((x,i)=>`<div class="card"><div class="row"><input value="${e(x.name)}" onchange="U('mixes.${i}.name',this.value)"><button class="s" onclick="D('mixes',${i})">🗑</button></div><label>الوزن الناتج من الوصفة (غ)<input type="number" value="${x.yield}" onchange="U('mixes.${i}.yield',+this.value||1,1)"></label><label>المخزون الحالي (غ)<input type="number" value="${+x.stock.toFixed(1)}" onchange="U('mixes.${i}.stock',+this.value)"></label><p>تكلفة كل 1000 غ: <b>${f(cpg(x)*1000)}</b></p><b>مكونات الوصفة</b>${IE('mixes.'+i+'.items',x.items)}</div>`).join('')+`<button class="b" onclick="A('mixes',{id:uid(),name:'خلطة جديدة',yield:1000,stock:0,items:[]})">+ خلطة</button>`},

st(){return `<div class="card"><h3>الألوان والأحجام</h3><label>اللون الرئيسي<input type="color" value="${S.theme.ac||'#1f5c4d'}" onchange="U('theme.ac',this.value,1)"></label><label>لون الخلفية<input type="color" value="${S.theme.bg||'#eef2ef'}" onchange="U('theme.bg',this.value,1)"></label><label>لون النص<input type="color" value="${S.theme.tx||'#14211d'}" onchange="U('theme.tx',this.value,1)"></label><label>حجم الأزرار<select onchange="U('theme.sz',this.value,1)">${[['s','صغير'],['m','متوسط'],['l','كبير']].map(o=>`<option value="${o[0]}" ${(S.theme.sz||'m')==o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></label><button class="s" onclick="S.theme={};save();render()">استعادة الألوان الأصلية</button></div><div class="card"><h3>نقاط الولاء</h3><label>نقاط لكل 1 من المبلغ<input type="number" step="any" value="${S.ppu}" onchange="U('ppu',+this.value||0)"></label><p class="mu">عدد الزبائن: ${S.cust.length}</p></div><div class="card"><h3>الطاولة</h3><label>رسوم الطاولة<input type="number" step="any" value="${S.fee}" onchange="U('fee',+this.value)"></label><label>تكلفة الطاولة المتوسطة (مناديل ومنظف...)<input type="number" step="any" value="${S.tcost}" onchange="U('tcost',+this.value)"></label></div><div class="card"><h3>الخصم</h3><label>أقصى خصم مسموح (٪ من الطلب)<input type="number" value="${S.maxd}" onchange="U('maxd',+this.value||0)"></label></div><div class="card"><h3>الفاتورة</h3><label>اسم الكافيه<input value="${e(cf().n)}" onchange="U('cafe',this.value)"></label><label>رسالة أسفل الفاتورة<input value="${e(cf().f)}" onchange="U('foot',this.value)"></label><label>عرض الورق<select onchange="U('pw',+this.value)"><option value="384" ${cf().w==384?'selected':''}>58 ملم</option><option value="576" ${cf().w==576?'selected':''}>80 ملم</option></select></label></div><div class="card"><h3>الرمز السري للمدير</h3><input type="text" inputmode="numeric" value="${e(S.pin)}" onchange="U('pin',this.value||'1234')"></div><div class="card"><h3>نسخة احتياطية</h3><p class="mu
